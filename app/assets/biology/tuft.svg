<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Tuft cell</title>
  <desc id="desc">Narrow tuft cell with long stiff apical microvilli, actin rootlets, tubulovesicular network, and basal process. Biological basis: Tuft cells are polarized chemosensory epithelial cells defined by unusually long actin-supported microvilli and an apical tubulovesicular system.</desc>
