  <title id="title">Virus</title>
  <desc id="desc">Enveloped icosahedral virus with genome-containing capsid, lipid envelope, and surface attachment spikes. Biological basis: Many animal viruses enclose a nucleocapsid within a host-derived lipid envelope bearing glycoprotein spikes used for receptor binding and entry.</desc>
