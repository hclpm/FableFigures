<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Goblet cell</title>
  <desc id="desc">Packed goblet cell with expanded apical mucin theca, narrow basal stalk, compressed basal nucleus, and secretion opening. Biological basis: Goblet cells package heavily glycosylated mucins into large apical granules that expand the cell apex and discharge into the lumen.</desc>
