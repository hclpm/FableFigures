<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">ER</title>
  <desc id="desc">Interconnected rough ER cisternae continuous with the nuclear envelope and studded by cytosolic ribosomes. Biological basis: Rough ER ribosomes synthesize secreted and membrane proteins into flattened cisternae for folding and quality control.</desc>
