<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Myeloid progenitor</title>
  <desc id="desc">Round common myeloid progenitor with moderate nucleus and sparse azurophilic granules. Biological basis: Myeloid commitment is accompanied by increasing cytoplasm and the first primary granules before mature lineage-specific granulation develops.</desc>
