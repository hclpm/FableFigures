<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Nucleus</title>
  <desc id="desc">Nucleus with double envelope, nuclear pores, peripheral chromatin, euchromatin, and a dense nucleolus. Biological basis: The nuclear envelope is continuous with ER and perforated by pore complexes; nucleoli assemble ribosomal subunits within chromatin-containing nucleoplasm.</desc>
