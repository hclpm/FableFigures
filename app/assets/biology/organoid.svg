<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Organoid</title>
  <desc id="desc">Budded epithelial organoid section with a continuous single-cell layer, central lumen, and crypt-like outward buds. Biological basis: Intestinal organoids organize as polarized epithelium surrounding a lumen; crypt domains bud outward as growth and lumen mechanics remodel the wall.</desc>
