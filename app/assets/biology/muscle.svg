<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Muscle cell</title>
  <desc id="desc">Long multinucleated skeletal muscle fiber with peripheral nuclei, repeated sarcomeric striations, and bundled myofibrils. Biological basis: Skeletal myofibers are syncytia; aligned sarcomeres create cross-striations while nuclei reside beneath the peripheral sarcolemma.</desc>
