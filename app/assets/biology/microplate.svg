  <title id="title">96-well plate</title>
  <desc id="desc">Perspective 96-well plate with 8×12 wells, rim, row/column cues, and differently filled assay wells. Biological basis: A standard 96-well plate arranges wells in eight rows and twelve columns for parallel liquid handling and optical assays.</desc>
