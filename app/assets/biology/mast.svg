<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Mast cell</title>
  <desc id="desc">Round tissue mast cell packed with metachromatic secretory granules around a small central nucleus. Biological basis: Mast-cell granules store histamine, proteases, and other mediators that are rapidly released after receptor-driven activation.</desc>
