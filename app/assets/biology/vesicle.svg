<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Vesicle</title>
  <desc id="desc">Membrane-bound transport vesicle with lipid bilayer, luminal cargo, and a partial protein coat. Biological basis: Transport vesicles bud with selective coats and cargo adaptors, then fuse with target membranes using tethering and SNARE machinery.</desc>
