<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Macrophage</title>
  <desc id="desc">Large amoeboid macrophage with pseudopods, bean-shaped nucleus, phagosomes, lysosomes, and engulfed cargo. Biological basis: Macrophages extend actin-rich pseudopods around particles and route engulfed material through phagosomes to acidic lysosomes.</desc>
