<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Organoid in Matrigel</title>
  <desc id="desc">Several budded organoids embedded at different depths inside a transparent extracellular-matrix dome. Biological basis: Matrigel or related matrices provide a 3D basement-membrane-like environment that supports organoid polarization and budding.</desc>
