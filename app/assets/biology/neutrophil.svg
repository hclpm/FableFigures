<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Neutrophil</title>
  <desc id="desc">Round neutrophil with segmented 3–5-lobed nucleus and fine pale cytoplasmic granules. Biological basis: Mature neutrophils have a segmented nucleus for confined migration and distinct primary and secondary antimicrobial granules.</desc>
