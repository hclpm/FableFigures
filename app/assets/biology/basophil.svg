<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Basophil</title>
  <desc id="desc">Round basophil whose bilobed nucleus is partly obscured by large dark blue-purple granules. Biological basis: Basophil granules contain histamine and proteoglycans and often overlap the nucleus in conventional stained morphology.</desc>
