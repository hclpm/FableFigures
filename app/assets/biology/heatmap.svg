  <title id="title">Heatmap</title>
  <desc id="desc">Expression heatmap with labeled red-blue matrix, row and column dendrograms, and a continuous color scale. Biological basis: Heatmaps encode values by color while hierarchical dendrograms expose similarity-based ordering of rows and columns.</desc>
