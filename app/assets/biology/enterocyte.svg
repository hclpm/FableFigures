<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Enterocyte</title>
  <desc id="desc">Tall packed absorptive enterocyte with apical brush border, terminal web, lateral junctions, elongated basal nucleus, and mitochondria. Biological basis: Enterocytes form a polarized columnar monolayer; dense apical microvilli increase absorptive surface while junctional complexes seal neighboring cells.</desc>
