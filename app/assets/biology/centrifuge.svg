<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Centrifuge</title>
  <desc id="desc">Benchtop microcentrifuge with open lid, rotor, tube positions, hinge, control panel, and safety latch. Biological basis: A centrifuge rotor subjects samples to radial acceleration; balanced tube placement and a locking lid are essential operating features.</desc>
