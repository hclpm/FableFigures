<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Paneth cell</title>
  <desc id="desc">Pyramidal crypt-base Paneth cell with basal nucleus, rough ER, and numerous bright apical antimicrobial granules. Biological basis: Paneth cells occupy the small-intestinal crypt base and secrete alpha-defensins, lysozyme, and other antimicrobials from apically concentrated dense-core granules.</desc>
