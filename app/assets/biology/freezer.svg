  <title id="title">-80 freezer</title>
  <desc id="desc">Upright ultra-low freezer with insulated outer door, inner compartments, latch, gasket, and −80 °C display. Biological basis: Ultra-low freezers use thick insulation, sealed compartments, and staged refrigeration to maintain approximately −80 °C storage.</desc>
