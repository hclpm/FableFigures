<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Endocrine cell</title>
  <desc id="desc">Narrow enteroendocrine epithelial cell with apical sensing process and basal dense-core secretory granules facing a capillary. Biological basis: Enteroendocrine cells sense luminal cues and release peptide hormones basolaterally toward nerves and fenestrated capillaries.</desc>
