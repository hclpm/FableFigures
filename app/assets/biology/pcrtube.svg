<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">PCR tubes</title>
  <desc id="desc">Eight-tube PCR strip with hinged caps, tapered reaction chambers, sample volumes, and connected top rail. Biological basis: Thin-walled PCR tubes promote rapid thermal transfer and are commonly supplied in connected strips with evaporation-limiting caps.</desc>
