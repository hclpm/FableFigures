<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Dendritic cell</title>
  <desc id="desc">Irregular antigen-presenting cell with branching dendrites, central nucleus, endocytic vesicles, and MHC-bearing membrane. Biological basis: Conventional dendritic cells use extensive processes to sample tissue and present processed peptide on MHC to lymphocytes.</desc>
