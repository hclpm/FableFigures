<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">T cell</title>
  <desc id="desc">Small round T lymphocyte with a large nucleus, narrow blue cytoplasm, and distributed TCR complexes. Biological basis: Resting T cells are non-adherent lymphocytes with scant cytoplasm; T-cell receptors and CD3 complexes are distributed across the plasma membrane.</desc>
