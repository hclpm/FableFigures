<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Mouse model</title>
  <desc id="desc">Upright laboratory mouse in three-quarter frontal view with paired pinnae, dark eye, pink nose, vibrissae, forepaws held at the chest, grounded hind paws, pear-shaped body, and a long horizontal tail. Biological basis: The laboratory mouse has a compact rodent body plan with prominent pinnae, vibrissae, small digit-bearing forepaws, weight-bearing hind feet, and a long tapering tail.</desc>
