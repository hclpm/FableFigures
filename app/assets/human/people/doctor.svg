  <title id="title">Clinician</title>
  <desc id="desc">Front-facing clinician wearing scrubs and a white coat with stethoscope, identification badge, pockets, and closed shoes. Design basis: Recognizable clinical garments and equipment distinguish the role while a neutral pose avoids caricature or specialty-specific assumptions.</desc>
